name: Android APK

permissions:
  contents: write

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  release:
    types: [published]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Decode signing keystore
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          echo "${{ secrets.SIGNING_KEYSTORE_BASE64 }}" | base64 -d > signing-keystore.jks

      - name: Build release APK
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: ./gradlew assembleRelease --stacktrace --console=plain

      - name: Sign release APK
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 != '' }}
        run: |
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/zipalign" -p -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk
          "$ANDROID_SDK_ROOT/build-tools/35.0.0/apksigner" sign \
            --ks signing-keystore.jks \
            --ks-key-alias "${{ secrets.SIGNING_KEY_ALIAS }}" \
            --ks-pass pass:"${{ secrets.SIGNING_STORE_PASSWORD }}" \
            --key-pass pass:"${{ secrets.SIGNING_KEY_PASSWORD }}" \
            --v1-signing-enabled false \
            --v2-signing-enabled true \
            --v3-signing-enabled true \
            --out AutoLauncher-release.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Build debug APK
        if: ${{ secrets.SIGNING_KEYSTORE_BASE64 == '' }}
        run: |
          ./gradlew assembleDebug --stacktrace --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk AutoLauncher-debug.apk

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: auto-launcher-apk
          path: |
            AutoLauncher-release.apk
            AutoLauncher-debug.apk
          if-no-files-found: ignore

      - name: Upload APK to GitHub Release
        if: ${{ github.event_name == 'release' }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AutoLauncher-release.apk
            AutoLauncher-debug.apk
